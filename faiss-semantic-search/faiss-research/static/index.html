<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAISS Vector Search - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            background: #000000;
            color: #ffffff;
            padding: 30px 40px;
            margin-bottom: 30px;
            border: 2px solid #000000;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #999999;
            font-weight: 400;
        }

        .search-section {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 30px 40px;
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 15px;
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            background: #f5f5f5;
        }

        .search-input::placeholder {
            color: #666666;
        }

        .search-button {
            padding: 14px 50px;
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        .search-button:hover {
            background: #333333;
            border-color: #333333;
        }

        .search-button:active {
            background: #000000;
        }

        .search-button:disabled {
            background: #666666;
            border-color: #666666;
            cursor: not-allowed;
        }

        .search-options {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-group label {
            font-size: 11px;
            color: #000000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .option-group.required label::after {
            content: " *";
            color: #000000;
        }

        .option-group select,
        .option-group input {
            padding: 10px 14px;
            border: 2px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 14px;
            font-family: inherit;
        }

        .option-group select:focus,
        .option-group input:focus {
            outline: none;
            background: #f5f5f5;
        }

        .results-section {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 30px 40px;
            margin-bottom: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #000000;
        }

        .results-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .results-count {
            color: #666666;
            font-size: 13px;
            font-weight: 600;
        }

        .result-item {
            border: 2px solid #000000;
            padding: 25px;
            margin-bottom: 20px;
            background: #ffffff;
        }

        .result-item:hover {
            background: #f5f5f5;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-source-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .result-source {
            color: #000000;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-type {
            display: inline-block;
            padding: 4px 10px;
            border: 2px solid #000000;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #ffffff;
            color: #000000;
        }

        .result-score {
            background: #000000;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid #000000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-text {
            color: #000000;
            line-height: 1.8;
            margin-top: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
        }

        .result-metadata {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #000000;
            font-size: 11px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-section {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 30px 40px;
        }

        .stats-header {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #000000;
        }

        .stats-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .namespace-card {
            background: #ffffff;
            border: 2px solid #000000;
            padding: 25px;
            margin-bottom: 20px;
        }

        .namespace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #000000;
        }

        .namespace-name {
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .namespace-widgets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .widget {
            background: #ffffff;
            padding: 20px;
            border: 2px solid #000000;
        }

        .widget-label {
            font-size: 10px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .widget-value {
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            line-height: 1.2;
        }

        .widget-subvalue {
            font-size: 11px;
            color: #666666;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border: 2px solid #000000;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #ffffff;
            color: #000000;
        }

        .badge-highlight {
            background: #000000;
            color: #ffffff;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666666;
        }

        .spinner {
            border: 3px solid #000000;
            border-top: 3px solid transparent;
            border-right: 3px solid transparent;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            padding: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666666;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 700;
            color: #000000;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .empty-state p {
            font-size: 13px;
            color: #666666;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #000000;
        }

        .tab {
            padding: 12px 30px;
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            border-bottom: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: inherit;
            margin-right: 2px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: #f5f5f5;
        }

        .tab.active {
            background: #000000;
            color: #ffffff;
        }

        .vectors-table-container {
            max-height: 600px;
            overflow-y: auto;
            overflow-x: auto;
            border: 2px solid #000000;
        }

        .vectors-table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
        }

        .vectors-table thead {
            position: sticky;
            top: 0;
            background: #000000;
            color: #ffffff;
            z-index: 10;
        }

        .vectors-table th {
            padding: 12px 15px;
            text-align: left;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #000000;
            border-top: none;
        }

        .vectors-table td {
            padding: 12px 15px;
            border: 1px solid #000000;
            color: #000000;
            font-size: 13px;
        }

        .vectors-table tbody tr {
            background: #ffffff;
        }

        .vectors-table tbody tr:hover {
            background: #f5f5f5;
        }

        .vectors-table tbody tr:nth-child(even) {
            background: #fafafa;
        }

        .vectors-table tbody tr:nth-child(even):hover {
            background: #f0f0f0;
        }

        .text-preview {
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            border: 2px solid #000000;
            background: #ffffff;
        }

        .table-controls input,
        .table-controls button {
            padding: 8px 12px;
            border: 2px solid #000000;
            background: #ffffff;
            color: #000000;
            font-size: 12px;
            font-family: inherit;
            font-weight: 600;
        }

        .table-controls button {
            background: #000000;
            color: #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-controls button:hover {
            background: #333333;
        }

        .table-controls button:disabled {
            background: #666666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>FAISS Vector Search</h1>
            <div class="subtitle">Semantic search dashboard</div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <form class="search-form" id="searchForm">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchQuery" 
                    placeholder="Enter search query..."
                    required
                >
                <button type="submit" class="search-button" id="searchButton">
                    SEARCH
                </button>
            </form>
            <div class="search-options">
                <div class="option-group required">
                    <label>Namespace</label>
                    <input type="text" id="namespace" placeholder="Required" required>
                </div>
                <div class="option-group">
                    <label>Results Count</label>
                    <input type="number" id="resultCount" value="10" min="1" max="100">
                </div>
                <div class="option-group">
                    <label>Vector Type</label>
                    <select id="vectorType">
                        <option value="both">Both</option>
                        <option value="text">Text</option>
                        <option value="image">Image</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>Search Results</h2>
                <div class="results-count" id="resultsCount"></div>
            </div>
            <div id="resultsContainer"></div>
        </div>

        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stats-header">
                <h2>Index Statistics</h2>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="showTab('stats')">Statistics</button>
                <button class="tab" onclick="showTab('vectors')">All Vectors</button>
            </div>
            <div id="statsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading statistics...
                </div>
            </div>
            <div id="vectorsContainer" style="display: none;">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading vectors...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5003';

        // Load stats on page load
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                displayStats(data);
            } catch (error) {
                document.getElementById('statsContainer').innerHTML = 
                    `<div class="error">Error loading statistics: ${error.message}</div>`;
            }
        }

        // Tab switching
        function showTab(tabName) {
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            
            // Hide all containers
            document.getElementById('statsContainer').style.display = 'none';
            document.getElementById('vectorsContainer').style.display = 'none';
            
            // Activate clicked tab
            event.target.classList.add('active');
            
            if (tabName === 'stats') {
                document.getElementById('statsContainer').style.display = 'block';
            } else if (tabName === 'vectors') {
                document.getElementById('vectorsContainer').style.display = 'block';
                loadVectors();
            }
        }

        function displayStats(data) {
            const container = document.getElementById('statsContainer');
            const aggregated = data.aggregated || {};
            const namespaces = aggregated.namespaces || {};
            
            if (Object.keys(namespaces).length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666666;">
                        No namespaces found. Ingest documents first.
                    </div>
                `;
                return;
            }

            let html = '';
            
            for (const [ns, info] of Object.entries(namespaces)) {
                const textVecs = info.text_vectors || 0;
                const imageVecs = info.image_vectors || 0;
                const total = textVecs + imageVecs;
                const indexType = info.index_type || 'N/A';
                const trained = info.trained;
                const nlist = info.nlist || 'N/A';
                const nprobe = info.nprobe || 'N/A';
                
                html += `
                    <div class="namespace-card">
                        <div class="namespace-header">
                            <div class="namespace-name">${ns}</div>
                            <div>
                                <span class="badge ${trained ? 'badge-highlight' : ''}">
                                    ${trained ? 'TRAINED' : 'NOT TRAINED'}
                                </span>
                            </div>
                        </div>
                        <div class="namespace-widgets">
                            <div class="widget">
                                <div class="widget-label">Total Vectors</div>
                                <div class="widget-value">${total.toLocaleString()}</div>
                                <div class="widget-subvalue">${textVecs.toLocaleString()} TEXT + ${imageVecs.toLocaleString()} IMAGE</div>
                            </div>
                            <div class="widget">
                                <div class="widget-label">Index Type</div>
                                <div class="widget-value" style="font-size: 16px;">${indexType}</div>
                            </div>
                            ${indexType === 'IVF_PQ' ? `
                            <div class="widget">
                                <div class="widget-label">NList</div>
                                <div class="widget-value">${nlist}</div>
                            </div>
                            <div class="widget">
                                <div class="widget-label">NProbe</div>
                                <div class="widget-value">${nprobe}</div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // Load all vectors
        let currentVectorsOffset = 0;
        const vectorsPerPage = 100;

        async function loadVectors() {
            const container = document.getElementById('vectorsContainer');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading vectors...</div>';

            try {
                const namespace = document.getElementById('namespace').value.trim() || undefined;
                const response = await fetch(`${API_BASE}/vectors?limit=${vectorsPerPage}&offset=${currentVectorsOffset}${namespace ? `&namespace=${encodeURIComponent(namespace)}` : ''}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                displayVectors(data);
            } catch (error) {
                container.innerHTML = `
                    <div class="error">
                        ERROR: ${error.message}
                    </div>
                `;
            }
        }

        function displayVectors(data) {
            const container = document.getElementById('vectorsContainer');
            const vectors = data.vectors || [];
            const totalCount = data.count || 0;

            if (vectors.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No Vectors Found</h3>
                        <p>No vectors in the database. Ingest documents first.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="table-controls">
                    <div>
                        <strong>Total: ${totalCount.toLocaleString()} vectors</strong>
                        ${data.namespace ? ` | Namespace: ${data.namespace}` : ' | All namespaces'}
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button onclick="previousPage()" ${currentVectorsOffset === 0 ? 'disabled' : ''}>PREV</button>
                        <span>Page ${Math.floor(currentVectorsOffset / vectorsPerPage) + 1}</span>
                        <button onclick="nextPage()" ${vectors.length < vectorsPerPage ? 'disabled' : ''}>NEXT</button>
                        <button onclick="loadVectors()" style="margin-left: 10px;">REFRESH</button>
                    </div>
                </div>
                <div class="vectors-table-container">
                    <table class="vectors-table">
                        <thead>
                            <tr>
                                <th>Vector ID</th>
                                <th>Namespace</th>
                                <th>Type</th>
                                <th>Document ID</th>
                                <th>Chunk ID</th>
                                <th>Text Preview</th>
                                <th>Created At</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            vectors.forEach((vector) => {
                const metadata = vector.metadata || {};
                const chunkText = metadata.chunk_text || '';
                const preview = chunkText.length > 100 ? chunkText.substring(0, 100) + '...' : chunkText;
                
                html += `
                    <tr>
                        <td><strong>${vector.vector_id || 'N/A'}</strong></td>
                        <td>${escapeHtml(vector.namespace || 'default')}</td>
                        <td><span class="badge">${vector.vector_type || 'N/A'}</span></td>
                        <td>${escapeHtml(vector.doc_id || 'N/A')}</td>
                        <td>${escapeHtml(vector.chunk_id || 'N/A')}</td>
                        <td class="text-preview" title="${escapeHtml(chunkText)}">${escapeHtml(preview)}</td>
                        <td>${vector.created_at || 'N/A'}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        function nextPage() {
            currentVectorsOffset += vectorsPerPage;
            loadVectors();
        }

        function previousPage() {
            currentVectorsOffset = Math.max(0, currentVectorsOffset - vectorsPerPage);
            loadVectors();
        }

        // Search functionality
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const query = document.getElementById('searchQuery').value.trim();
            const namespace = document.getElementById('namespace').value.trim();
            const k = parseInt(document.getElementById('resultCount').value) || 10;
            const vectorType = document.getElementById('vectorType').value;

            if (!query) {
                alert('Please enter a search query');
                return;
            }

            if (!namespace) {
                alert('Namespace is required');
                return;
            }

            const searchButton = document.getElementById('searchButton');
            const resultsSection = document.getElementById('resultsSection');
            const resultsContainer = document.getElementById('resultsContainer');

            searchButton.disabled = true;
            searchButton.textContent = 'SEARCHING...';
            resultsSection.style.display = 'block';
            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

            try {
                const response = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query,
                        k,
                        vector_type: vectorType,
                        namespace
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                displayResults(data);
            } catch (error) {
                resultsContainer.innerHTML = `
                    <div class="error">
                        ERROR: ${error.message}
                    </div>
                `;
            } finally {
                searchButton.disabled = false;
                searchButton.textContent = 'SEARCH';
            }
        });

        function displayResults(data) {
            const container = document.getElementById('resultsContainer');
            const countDiv = document.getElementById('resultsCount');

            // Combine all results into one unified list
            const allResults = [];
            
            // Add text results
            (data.text_results || []).forEach(result => {
                allResults.push({...result, type: 'text'});
            });
            
            // Add image results
            (data.image_results || []).forEach(result => {
                allResults.push({...result, type: 'image'});
            });

            // Sort by score (descending)
            allResults.sort((a, b) => (b.score || 0) - (a.score || 0));

            const totalResults = allResults.length;
            countDiv.textContent = `${totalResults} RESULT${totalResults !== 1 ? 'S' : ''}`;

            if (totalResults === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No Results Found</h3>
                        <p>Try a different search query or check if data has been ingested for this namespace.</p>
                    </div>
                `;
                return;
            }

            let html = '';

            allResults.forEach((result) => {
                const metadata = result.metadata || {};
                const score = (result.score || 0).toFixed(4);
                const isText = result.type === 'text';
                
                if (isText) {
                    const chunkText = metadata.chunk_text || 'No text available';
                    const sourceFile = metadata.source_file || 'Unknown';
                    const chunkId = metadata.chunk_id || '';
                    
                    html += `
                        <div class="result-item">
                            <div class="result-header">
                                <div class="result-source-info">
                                    <span class="result-source">${escapeHtml(sourceFile)}</span>
                                    <span class="result-type">TEXT</span>
                                </div>
                                <span class="result-score">SCORE: ${score}</span>
                            </div>
                            <div class="result-text">${escapeHtml(chunkText)}</div>
                            <div class="result-metadata">
                                CHUNK ID: ${escapeHtml(chunkId)} | VECTOR ID: ${result.vector_id || 'N/A'}
                            </div>
                        </div>
                    `;
                } else {
                    const sourceFile = metadata.source_file || 'Unknown';
                    const imageId = metadata.image_id || '';
                    const pageNum = metadata.page_num;
                    
                    html += `
                        <div class="result-item">
                            <div class="result-header">
                                <div class="result-source-info">
                                    <span class="result-source">${escapeHtml(sourceFile)}${pageNum ? ` (PAGE ${pageNum})` : ''}</span>
                                    <span class="result-type">IMAGE</span>
                                </div>
                                <span class="result-score">SCORE: ${score}</span>
                            </div>
                            <div class="result-metadata">
                                IMAGE ID: ${escapeHtml(imageId)} | VECTOR ID: ${result.vector_id || 'N/A'}
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load stats on page load
        loadStats();
        
        // Refresh stats every 30 seconds
        setInterval(loadStats, 30000);
        
        // Reset vectors offset when namespace changes
        document.getElementById('namespace').addEventListener('change', () => {
            currentVectorsOffset = 0;
            // Reload vectors if vectors tab is active
            if (document.getElementById('vectorsContainer').style.display !== 'none') {
                loadVectors();
            }
        });
    </script>
</body>
</html>
